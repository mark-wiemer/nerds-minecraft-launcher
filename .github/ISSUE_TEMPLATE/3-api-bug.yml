name: 🛠️ API issue (n/a for NML)
description: Report an issue regarding the NML API.
labels: [bug, backend]
body:
  - type: checkboxes
    attributes:
      label: Please confirm the following.
      options:
        - label: I know that the NML API does not exist.
          required: true
        - label: This is a test bug that I don't expect to be resolved.
          required: true
  - type: textarea
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is. Include screenshots if applicable.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: false
  - type: textarea
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
    validations:
      required: false
