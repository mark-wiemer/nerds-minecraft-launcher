name: 💡 Feature Request
description: Suggest an idea
labels: [enhancement]

body:
  - type: dropdown
    id: projects
    attributes:
      label: What parts of NML is your feature request related to?
      multiple: true
      options:
        - App
        - Website
        - API
  - type: textarea
    attributes:
      label: Is your suggested feature related to a problem? Please describe.
      description: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
    validations:
      required: false
  - type: textarea
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the suggested enhancement here.
    validations:
      required: false
